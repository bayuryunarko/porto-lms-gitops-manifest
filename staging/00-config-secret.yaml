apiVersion: v1
kind: ConfigMap
metadata:
  name: lms-config-staging
  namespace: default
data:
  # Konfigurasi Jaringan ke Docker Engine (Stateful)
  # Menggunakan IP Gateway default Docker (172.17.0.1) untuk menembus keluar dari K3s ke VM host
  DB_HOST: "172.17.0.1"
  DB_PORT: "5432"
  REDIS_HOST: "172.17.0.1"
  REDIS_PORT: "6379"
  
  # Konfigurasi Layanan Terkelola GCP
  GCS_BUCKET_NAME: "porto-staging-bucket"
  ENVIRONMENT: "staging"

---
apiVersion: v1
kind: Secret
metadata:
  name: lms-secret-staging
  namespace: default
type: Opaque
data:
  # CATATAN: Semua nilai di dalam Secret harus di-encode menggunakan Base64
  # Contoh di bawah: 'password123' di-encode menjadi 'cGFzc3dvcmQxMjM='
  DB_PASSWORD: "cGFzc3dvcmQxMjM="
  
  # Contoh di bawah: 'supersecretkey' di-encode menjadi 'c3VwZXJzZWNyZXRrZXk='
  INTERNAL_API_KEY: "c3VwZXJzZWNyZXRrZXk="