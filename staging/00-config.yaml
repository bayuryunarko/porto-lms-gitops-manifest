# ./staging/00-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: lms-config-staging
  namespace: lms-staging
data:
  # Konfigurasi Database & Cache (Teks Biasa)
  POSTGRES_USER: "admin"
  DB_HOST: "172.17.0.1" 
  DB_PORT: "5432"
  REDIS_HOST: "172.17.0.1"
  REDIS_PORT: "6379"

  # Konfigurasi Aplikasi & Lingkungan
  ENVIRONMENT: "production"
  STORAGE_MODE: "gcs"
  ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1" 
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  
  # Konfigurasi Bootstrapping Aplikasi (Tidak Rahasia)
  FIRST_ADMIN_USER: "admin_gcp"
  
  # Cadangan Jika Menggunakan Cloud Storage Nanti
  GCS_BUCKET_NAME: "porto-staging-bucket"
  GCP_BUCKET_NAME: "porto-staging-bucket"