# ==========================================
# 3. ASSESSMENT SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assessment-service
  template:
    metadata:
      labels:
        app: assessment-service
    spec:
      containers:
      - name: assessment-service
        image: us-central1-docker.pkg.dev/bayu-project/porto-lms-images/assessment-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_NAME
          value: "assessment_db"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: DB_PORT
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: DB_PASSWORD
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: INTERNAL_API_KEY
        # Injeksi URL internal Kuberbetes untuk menembak skor baru ke Leaderboard
        - name: LEADERBOARD_URL
          value: "http://leaderboard-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: assessment-service
spec:
  type: ClusterIP
  selector:
    app: assessment-service
  ports:
  - port: 8000
    targetPort: 8000

