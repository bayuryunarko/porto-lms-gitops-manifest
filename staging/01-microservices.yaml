# ./staging/01-microservices.yaml
# ==========================================
# 1. AUTH SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: lms-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
      - name: gcp-ar-secret
      containers:
      - name: auth-service
        image: us-central1-docker.pkg.dev/bayu-project-502304/porto-lms-images/auth-service:staging-130ade70fdc03ef43977ae23882b93fa75215f0c
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: AUTH_DB_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: SECRET_KEY
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: ALLOWED_ORIGINS
        - name: FIRST_ADMIN_USER
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: FIRST_ADMIN_USER
        - name: FIRST_ADMIN_PASS
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: FIRST_ADMIN_PASS
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: ENVIRONMENT
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - port: 8000
    targetPort: 8000
---
