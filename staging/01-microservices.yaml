# ==========================================
# 3. ASSESSMENT SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-service
  namespace: lms-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assessment-service
  template:
    metadata:
      labels:
        app: assessment-service
    spec:
      imagePullSecrets:
      - name: gcp-ar-secret
      containers:
      - name: assessment-service
        image: us-central1-docker.pkg.dev/bayu-project-502304/porto-lms-images/assessment-service:staging-130ade70fdc03ef43977ae23882b93fa75215f0c
        ports:
        - containerPort: 8002
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: ASSESSMENT_DB_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: SECRET_KEY
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: ENVIRONMENT
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: INTERNAL_API_KEY
        - name: LEADERBOARD_SERVICE_URL
          value: "http://leaderboard-service:8003"
---
apiVersion: v1
kind: Service
metadata:
  name: assessment-service
spec:
  type: ClusterIP
  selector:
    app: assessment-service
  ports:
  - port: 8002
    targetPort: 8002
---

# ==========================================
# 4. LEADERBOARD SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderboard-service
  namespace: lms-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaderboard-service
  template:
    metadata:
      labels:
        app: leaderboard-service
    spec:
      imagePullSecrets:
      - name: gcp-ar-secret    
      containers:
      - name: leaderboard-service
        image: us-central1-docker.pkg.dev/bayu-project-502304/porto-lms-images/leaderboard-service:staging-130ade70fdc03ef43977ae23882b93fa75215f0c
        ports:
        - containerPort: 8003
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: REDIS_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: SECRET_KEY
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: INTERNAL_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: leaderboard-service
spec:
  type: ClusterIP
  selector:
    app: leaderboard-service
  ports:
  - port: 8003
    targetPort: 8003