# ==========================================
# 1. AUTH SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        # Gunakan URL Artifact Registry Anda nanti
        image: us-central1-docker.pkg.dev/bayu-project/porto-lms-images/auth-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_NAME
          value: "auth_db"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: DB_PORT
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - port: 8000
    targetPort: 8000

