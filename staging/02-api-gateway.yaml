# ==========================================
# API GATEWAY (Golang)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: lms-staging # <-- (1) Diubah dari default menjadi lms-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
      - name: gcp-ar-secret    
      containers:
      - name: api-gateway
        image: us-central1-docker.pkg.dev/bayu-project-502304/porto-lms-images/api-gateway:staging-1d6637977e811f2b89f9496d67386a94c019e5a1
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lms-secret-staging
              key: REDIS_PASSWORD
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8000"
        - name: CONTENT_SERVICE_URL
          value: "http://content-service:8001"
        - name: ASSESSMENT_SERVICE_URL
          value: "http://assessment-service:8002"
        - name: LEADERBOARD_SERVICE_URL
          value: "http://leaderboard-service:8003"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: lms-staging # <-- (2) INI YANG SEBELUMNYA HILANG
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080