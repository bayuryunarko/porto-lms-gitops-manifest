# ==========================================
# API GATEWAY (Golang)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: us-central1-docker.pkg.dev/bayu-project/porto-lms-images/api-gateway:latest
        ports:
        - containerPort: 8080
        env:
        # 1. Konfigurasi Redis untuk Rate Limiting
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: lms-config-staging
              key: REDIS_PORT
        
        # 2. Registrasi Rute Microservices (Internal Kuberbetes DNS)
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8000"
        - name: CONTENT_SERVICE_URL
          value: "http://content-service:8000"
        - name: ASSESSMENT_SERVICE_URL
          value: "http://assessment-service:8000"
        - name: LEADERBOARD_SERVICE_URL
          value: "http://leaderboard-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080