# ==========================================
# 1. FRONTEND MAIN (Dasbor, Login, Ranking)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-main
  namespace: lms-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fe-main
  template:
    metadata:
      labels:
        app: fe-main
    spec:
      imagePullSecrets:
      - name: gcp-ar-secret    
      containers:
      - name: fe-main
        image: us-central1-docker.pkg.dev/bayu-project-502304/porto-lms-images/fe-main:staging-1d6637977e811f2b89f9496d67386a94c019e5a1
        ports:
        - containerPort: 80 
---
apiVersion: v1
kind: Service
metadata:
  name: fe-main
  namespace: lms-staging # <-- INI YANG SEBELUMNYA HILANG
spec:
  type: ClusterIP
  selector:
    app: fe-main
  ports:
  - port: 80
    targetPort: 80

